# Serve the SPA and proxy /api to the backend service (docker-compose network).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: unknown routes serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Forward API calls to the FastAPI backend container.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
    client_max_body_size 20m;

    # The progress endpoint streams Server-Sent Events. Buffering would hold
    # every stage update until the run finished, defeating the point.
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
